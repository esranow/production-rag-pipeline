[project]
name = "production-rag-pipeline"
version = "0.1.0"
description = "Production-grade Retrieval-Augmented Generation pipeline"
authors = [{ name = "Engineering Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "qdrant-client>=1.12.0",
    "litellm>=1.52.0",
    "fastembed>=0.4.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.3.0",
    "pypdf>=5.1.0",
    "python-multipart>=0.0.17",
    "langfuse>=2.54.0",
    "ragas>=0.2.6",
    "redis>=5.2.0",
    "httpx>=0.27.2",
    "rich>=13.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
