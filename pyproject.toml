[project]
name = "production-rag-pipeline"
version = "0.1.0"
description = "Production-grade Retrieval-Augmented Generation pipeline"
authors = [{ name = "Engineering Team" }]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "streamlit>=1.35.0",
    "google-genai>=0.1.1",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
eval = [
    "langfuse>=2.54.0",
    "ragas>=0.2.6",
]
storage = [
    "qdrant-client>=1.12.0",
    "redis>=5.2.0",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
